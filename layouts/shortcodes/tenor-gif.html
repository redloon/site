
{{ $description := "Tenor GIF" }}
{{ if gt (len .Params) 2 }}{{ $description = .Get 2 }}{{ end }}
<div class="tenor-gif">
    <iframe src="https://tenor.com/embed/{{ .Get 0 }}" title="{{ $description }}" loading="lazy" style="display:block; width:70%; height:auto; aspect-ratio:1.665; border:0;" allowfullscreen></iframe>
    <a href="{{ .Get 1 }}">View on Tenor: {{ $description }}</a>
</div>
